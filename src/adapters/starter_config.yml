# ghma configuration. Everything is off until you enable it; see the README for the details.
# Lines starting with `#~ ` are optional features: remove the marker to switch them on.
version: 1

#~ # Spread the commits over a time window (original times are kept without this).
#~ from: 2026-04-01          # lower bound, required with `schedule`
#~ to: now                   # `now` or a date (end of that day)
#~ timezone: UTC             # IANA name, e.g. Europe/Berlin
#~ schedule:
#~   days: [mon, tue, wed, thu, fri]   # mon tue wed thu fri sat sun
#~   hours: "09:30-18:00"    # or a list: ["18:00-24:00", "06:00-07:00"]; "18:00-06:00" runs past midnight
#~   distribution: uniform   # uniform | weekday-weighted | bursty
#~   seed: 42

#~ # Rewrite identities (first match wins).
#~ identity:
#~   - match: { email: me@home.org }
#~     set:   { name: Jane Doe, email: jane@work.com }

messages:
  strip_trailers: []         # e.g. [Co-Authored-By]
  add_trailers: []           # e.g. ["Assisted-By: Claude <noreply@anthropic.com>"]
  rewrite_trailers: []       # e.g. [{match: '^Co-Authored-By: Claude (\\w+) .*$', replace: 'Assisted-By: Claude $1'}]
  title_only: false          # true drops the message body (subject and trailers stay)

#~ # Remove paths from history (gitignore syntax); they are added to .gitignore instead.
#~ paths:
#~   exclude: ["secrets/", "*.env"]
#~   gitignore: true
#~   only_excluded_commits: drop   # drop | keep

signing: strip               # strip | resign
hook:
  mode: verify               # verify | rewrite
# backend: git               # object backend: gix (default) | git
