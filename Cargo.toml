[package]
name = "ghma"
version = "0.1.0"
edition = "2024"
description = "git hide my ass: redistribute commit times, identities and messages on the current branch, safely"

[lib]
name = "ghma"
path = "src/lib.rs"

[[bin]]
name = "ghma"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"

gix = { version = "0.88", default-features = false, features = ["sha1", "revision", "parallel"], optional = true }

[features]
# Optional in-process object backend (`--backend gix`); the git CLI stays the default.
gix = ["dep:gix"]

[dev-dependencies]
tempfile = "3"
