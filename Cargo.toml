[package]
name = "ghma"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/tdymel/ghma"
readme = "README.md"
description = "git hide my ass: redistribute commit times, identities and messages on the current branch, safely"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

gix = { version = "0.88", default-features = false, features = ["sha1", "revision", "parallel"], optional = true }
rand = "0.10"
rand_chacha = "0.10"
fnv = "1"
ignore = "0.4"

[features]
default = ["gix"]
# In-process object backend (the default backend). Build with `--no-default-features` for a git-CLI-only binary.
gix = ["dep:gix"]

[dev-dependencies]
archunit = "0.0.2"
tempfile = "3"
